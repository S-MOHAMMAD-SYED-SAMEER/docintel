# Local, reproducible stack: PostgreSQL, the migration, then the application.
#
#   docker compose up --build          # database, migrate once, then serve
#   curl localhost:8000/health
#
# Development convenience only. The credentials below are local defaults;
# supply real ones through the environment before running this anywhere else.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  # Migrations run once, as their own step, and the application waits for
  # them to finish. Deliberately not run from application startup: replicas
  # would race the same DDL, and a failed migration would take a running
  # service down with it. Uses the same image and the same Alembic
  # configuration the "Local" run instructions do — no second migration
  # mechanism.
  migrate:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      # Leave unset to fall back to the SDK's own ANTHROPIC_API_KEY lookup.
      DOCINTEL_ANTHROPIC_API_KEY: ${DOCINTEL_ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - storage:/var/lib/docintel/storage

  # Seeds the demo's three recognised sample invoices (see demo/seed.py,
  # docs/DEMO.md §5) through the real upload/render pipeline, before the
  # demo app is reachable. Required because the demo's mutation guard
  # (app/api/demo_guard.py) refuses every upload -- without this step the
  # demo would have nothing to show. Idempotent, so re-running this stack
  # against the same volume never duplicates the seeded documents. Does
  # not run for `app` (Live Mode): only `demo` depends on it.
  seed:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
    command: ["python", "-m", "demo.seed"]
    volumes:
      - storage:/var/lib/docintel/storage
    restart: "no"

  # Same image as `app`, with the extraction provider swapped for the
  # deterministic, credential-free demo (see demo/app.py, docs/DEMO.md). No
  # Anthropic key: the demo provider never calls out. Uses `python -m
  # uvicorn` rather than the bare `uvicorn` the image's own CMD runs, so the
  # working directory's raw `demo/` copy (with its fixture JSON) resolves --
  # the same reason `python -m evals.run` is used instead of a console
  # script for the evaluation harness.
  demo:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      # Off by default (app/config.py) -- this deployment opts in so a
      # public visitor cannot call POST /api/v1/documents/{id}/extract in
      # an unbounded loop. In-process only; see app/api/rate_limit.py's
      # own docstring for why no Redis or other external service is
      # needed for this one-container deployment.
      DOCINTEL_DEMO_RATE_LIMIT_ENABLED: "true"
    command: ["python", "-m", "uvicorn", "demo.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    volumes:
      - storage:/var/lib/docintel/storage

volumes:
  db-data:
  storage:
