[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence with human review: extract business documents to a validated schema, score per-field confidence, route uncertain fields to a review queue."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pypdfium2>=4.30",
    # pypdfium2 renders to a raw bitmap; Pillow is how that bitmap becomes a
    # PNG on disk, and how uploaded images are normalised to the same format.
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "anthropic>=1.5,<2",
]

# Dependencies are added as the milestone that needs them lands, so the
# install stays honest about what the code actually imports.
#   m6: jinja2

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
